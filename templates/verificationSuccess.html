<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>אימות חשבון הצליח</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f4f7;
      font-family: 'Arial', sans-serif;
      direction: rtl;
      text-align: right;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="text-align: center"
    >
      <tr>
        <td align="center">
          <table
            width="75%"
            style="
              background: white;
              border-radius: 12px;
              padding: 40px;
              box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
            "
          >
            <tr>
              <td>
                <div style="font-size: 48px; margin-bottom: 15px">🎉</div>

                <h3 style="color: #888; font-size: 18px; margin: 0 0 8px">
                  שלום, {{userName}}! 👋
                </h3>

                <h1 style="color: #2c2c2c; margin: 0 0 10px; font-size: 28px">
                  החשבון אומת בהצלחה!
                </h1>

                <p style="color: #555; font-size: 15px; margin: 0 0 25px">
                  כתובת האימייל שלך אומתה בהצלחה.<br />
                  כעת ניתן להתחבר לחשבון שלך.
                </p>

                <a
                  href="{{loginUrl}}"
                  style="
                    display: inline-block;
                    background: #4f46e5;
                    padding: 12px 24px;
                    color: white;
                    text-decoration: none;
                    border-radius: 8px;
                    font-size: 16px;
                    box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3);
                  "
                >
                  מעבר להתחברות
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
